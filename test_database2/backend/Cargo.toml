[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
http = "1.5.0"
pdfrs = "0.1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite = "0.37.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http ={version = "0.7.1", features = ["trace", "cors"]}
